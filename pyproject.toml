[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-curation-agent"
version = "0.1.0"
description = "No-API-lock-in agent that curates TitanCNA copy-number/LOH candidate solutions using independent Claude + Gemini visual review."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    # Upper bound pinned to <=1.26.0, reproduced empirically on this cluster
    # (rhino, glibc 2.27/Ubuntu 18.04-based): `pip install --only-binary=:all:
    # pymupdf` shows 1.26.0 is the LAST release with a manylinux wheel
    # compatible with this glibc -- every version from 1.26.1 through the
    # current 1.28.x line ships source-only (or a newer-manylinux-only wheel
    # this glibc can't use), so a plain `pip install` picks the newest
    # matching version first and falls back to building it from source.
    # That source build then hits a real upstream bug (mupdf's SWIG output
    # still calls the Python-2-only PyString_FromString, which doesn't exist
    # in Python 3 and fails to compile -- confirmed present in at least
    # mupdf-1.27.2 and mupdf-1.28.2's sdists, see
    # https://github.com/pymupdf/PyMuPDF/discussions/2394). <1.28 alone is
    # NOT enough -- confirmed it still resolves to the source-only 1.27.2 and
    # fails the same way. <=1.26.0 guarantees pip lands on a wheel instead.
    "PyMuPDF>=1.23,<=1.26.0",
    "Pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Reviewer backends -- install whichever you plan to use (or both).
direct = ["anthropic>=0.40.0", "google-genai>=1.0.0"]
perplexity = ["perplexityai>=0.1.0"]
all = ["anthropic>=0.40.0", "google-genai>=1.0.0", "perplexityai>=0.1.0"]

[project.scripts]
titan-curate = "titan_curation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
titan_curation = ["knowledge/*.md"]
