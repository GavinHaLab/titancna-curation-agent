[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-curation-agent"
version = "0.1.0"
description = "No-API-lock-in agent that curates TitanCNA copy-number/LOH candidate solutions using independent Claude + Gemini visual review."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    # Upper bound excludes 1.28.x: its mupdf-1.28.2 sdist has a confirmed
    # upstream build bug (dead code still calls the Python-2-only
    # PyString_FromString, which doesn't exist in Python 3 and fails to
    # compile) -- see https://github.com/pymupdf/PyMuPDF/discussions/2394.
    # Only bites systems without a prebuilt wheel for their platform (e.g.
    # an HPC node with an older glibc than PyMuPDF's current manylinux
    # baseline requires), where pip falls back to building from source.
    "PyMuPDF>=1.23,<1.28",
    "Pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Reviewer backends -- install whichever you plan to use (or both).
direct = ["anthropic>=0.40.0", "google-genai>=1.0.0"]
perplexity = ["perplexityai>=0.1.0"]
all = ["anthropic>=0.40.0", "google-genai>=1.0.0", "perplexityai>=0.1.0"]

[project.scripts]
titan-curate = "titan_curation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
titan_curation = ["knowledge/*.md"]
