# Copy to config.yaml and fill in, OR just use environment variables / CLI flags
# instead -- config.yaml is entirely optional. Precedence is always:
#   CLI flag  >  environment variable  >  this file
#
# This lets a shared/org key live here while any individual teammate overrides
# it with their own personal key via env vars or CLI flags, with no code changes.

# One Perplexity API key drives BOTH reviewer roles.
perplexity:
  api_key: ""                                  # or leave blank and use PERPLEXITY_API_KEY env var
  claude_model: "anthropic/claude-sonnet-5-5"
  second_model: "openai/gpt-5.5"

# ---- Optional: sampling controls (both reviewer roles) ----
# Left unset by default (API default, currently 1.0). Lower (e.g. 0) reduces
# -- but does not eliminate -- run-to-run variance in the recommendation.
# temperature: 0

# minimal|low|medium|high|xhigh. Lower effort cuts reasoning-token spend
# substantially (the dominant driver of output-token cost on this endpoint)
# at the cost of potentially shallower analysis.
# reasoning_effort: "low"
